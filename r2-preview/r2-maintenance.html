<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Validação privada das fotos</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:20px}button{padding:12px;margin:8px}pre{white-space:pre-wrap}a{color:#075985}</style>
<h1>Validação e migração das fotos</h1><p>Acesso exclusivo ao administrador aprovado. As fotos permanecem privadas.</p><p>Ferramenta de manutenção — revisão 2</p><label><input type="checkbox" id="backupVerified"> Já tenho o backup salvo e verificado</label><p id="account">Verificando sessão…</p><button id="test" disabled>Testar envio, leitura e exclusão de foto de teste</button><button id="backup" disabled>Baixar backup das ocorrências e fotos vinculadas</button><button id="migrate" disabled>Migrar fotos após verificar o backup</button><p><a href="../">Voltar ao sistema</a></p><pre id="log"></pre>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import {getDatabase,ref,get,update,runTransaction,onValue} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
import {createPhotoStorage} from './photo-storage.js';
const app=initializeApp({apiKey:'AIzaSyDDli2nrlO8g8dCxawIV5LVEZbEt-RTR-Q',authDomain:'inspecaoseguranca-fe2c4.firebaseapp.com',databaseURL:'https://inspecaoseguranca-fe2c4-default-rtdb.firebaseio.com',projectId:'inspecaoseguranca-fe2c4'});
const auth=getAuth(app),db=getDatabase(app),storage=createPhotoStorage({getUser:()=>auth.currentUser});
const log=document.getElementById('log'),buttons=[...document.querySelectorAll('button')];let backedUp=false,busy=false;
function say(text){log.textContent+=text+'\n';}
async function admin(){const u=auth.currentUser;if(!u)throw Error('Entre como administrador no sistema e volte a esta página.');const p=(await get(ref(db,'users/'+u.uid))).val();if(p?.status!=='approved'||p.role!=='admin')throw Error('Administrador aprovado necessário.');return u;}
onAuthStateChanged(auth,async()=>{try{await admin();document.getElementById('account').textContent='Administrador conectado. Serviço: '+(storage.enabled?'R2 configurado':'R2 desativado');buttons.forEach(b=>b.disabled=false);}catch(e){document.getElementById('account').textContent=e.message;buttons.forEach(b=>b.disabled=true);}});
async function action(fn){if(busy)return;busy=true;buttons.forEach(b=>b.disabled=true);try{await admin();await fn();}catch(e){say('ERRO: '+e.message);}finally{busy=false;buttons.forEach(b=>b.disabled=false);}}
document.getElementById('test').onclick=()=>action(async()=>{if(!storage.enabled)throw Error('R2 desativado.');const id=String(Date.now()),u=await admin();let descriptor,published=false;try{const canvas=document.createElement('canvas');canvas.width=canvas.height=24;const c=canvas.getContext('2d');c.fillStyle='#087f5b';c.fillRect(0,0,24,24);const source=canvas.toDataURL('image/jpeg',.7);descriptor=await storage.upload(id,'foto',source);if(descriptor.storage!=='r2')throw Error('Envio não chegou ao R2.');await update(ref(db),{['ocorrencias/'+id]:{id:Number(id),ticket:0,status:'pendente',local:'TESTE R2 DESCARTÁVEL',setor:'Teste',desc:'Validação técnica temporária',createdByUid:u.uid,temFoto:true},['fotos/'+id+'/foto']:descriptor});published=true;const stored=(await get(ref(db,'fotos/'+id+'/foto'))).val();if((await storage.read(id,'foto',stored))!==source)throw Error('Foto recebida difere da original.');say('OK: upload R2, referência Firebase e leitura autenticada; bytes preservados.');}finally{if(published)await update(ref(db),{['ocorrencias/'+id]:null,['fotos/'+id]:null});if(descriptor)await storage.remove(id,'foto',descriptor);say('Foto e ocorrência temporárias removidas.');}say('TESTE REAL CONCLUÍDO.');});
document.getElementById('backup').onclick=()=>action(async()=>{const ocorrencias=(await get(ref(db,'ocorrencias'))).val()||{},fotos={};for(const id of Object.keys(ocorrencias)){const value=(await get(ref(db,'fotos/'+id))).val();if(value)fotos[id]=value;}const text=JSON.stringify({exportedAt:new Date().toISOString(),ocorrencias,fotos},null,2);const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-ocorrencias-fotos-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);backedUp=true;say('Backup solicitado: '+Object.keys(ocorrencias).length+' ocorrências, '+Object.keys(fotos).length+' grupos de fotos. Confirme que o arquivo foi salvo antes de migrar.');});
document.getElementById('migrate').onclick=()=>action(async()=>{if(!backedUp&&!document.getElementById('backupVerified').checked)throw Error('Baixe e verifique o backup primeiro.');if(!storage.enabled)throw Error('R2 desativado.');const ocorrencias=(await get(ref(db,'ocorrencias'))).val()||{};let copied=0;for(const id of Object.keys(ocorrencias)){for(const field of ['foto','fotoConclusao']){const target=ref(db,'fotos/'+id+'/'+field);let stop=()=>{};try{const original=await new Promise((resolve,reject)=>{stop=onValue(target,snapshot=>resolve(snapshot.val()),reject);});if(typeof original!=='string'||!original.startsWith('data:image/jpeg;base64,'))continue;const descriptor=await storage.upload(id,field,original);const result=await runTransaction(target,current=>current===original?descriptor:undefined,{applyLocally:false});if(!result.committed){say('Ignorada foto alterada durante a migração: '+id+'/'+field);await storage.remove(id,field,descriptor);continue;}try{if((await storage.read(id,field,descriptor))!==original)throw Error('Verificação de bytes falhou.');copied++;say('Verificada: '+id+'/'+field);}catch(e){const rollback=await runTransaction(target,current=>current?.storage==='r2'&&current.key===descriptor.key?original:undefined,{applyLocally:false});say('Verificação falhou; restauração '+(rollback.committed?'concluída':'não aplicada por alteração concorrente')+': '+id+'/'+field);throw e;}}finally{stop();}}}say('MIGRAÇÃO CONCLUÍDA: '+copied+' fotos copiadas e verificadas. Guarde o backup. Fotos em outros formatos ou embutidas na ocorrência não foram alteradas.');});
</script></html>
