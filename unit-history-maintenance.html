<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Vincular histórico à unidade 101</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:20px}button{padding:12px;margin:8px}pre{white-space:pre-wrap}</style>
<h1>Vincular histórico à unidade 101 — Ponte</h1>
<p>Manutenção exclusiva para administrador. Preserva protocolos, fotos, prazos e usuários. Não exclui arquivos nem muda o local físico das fotos.</p>
<p id="account">Verificando sessão…</p><button id="backup" disabled>Baixar backup do histórico e cadastros</button>
<label><input type="checkbox" id="verified"> Conferi que o backup foi salvo</label>
<button id="bind" disabled>Vincular histórico e fábricas atuais à unidade 101</button><pre id="log"></pre>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import {getDatabase,ref,get,runTransaction,onValue} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
const app=initializeApp({apiKey:'AIzaSyDDli2nrlO8g8dCxawIV5LVEZbEt-RTR-Q',authDomain:'inspecaoseguranca-fe2c4.firebaseapp.com',databaseURL:'https://inspecaoseguranca-fe2c4-default-rtdb.firebaseio.com',projectId:'inspecaoseguranca-fe2c4'});
const auth=getAuth(app),db=getDatabase(app),log=document.getElementById('log');let plan=null,busy=false;
function say(t){log.textContent+=t+'\n';}
async function transaction(path,fn){const target=ref(db,path);let stop=()=>{};try{await new Promise((resolve,reject)=>{stop=onValue(target,resolve,reject);});return await runTransaction(target,fn,{applyLocally:false});}finally{stop();}}
async function admin(){const u=auth.currentUser;if(!u)throw Error('Entre como administrador no sistema.');const p=(await get(ref(db,'users/'+u.uid))).val();if(p?.role!=='admin'||p.status!=='approved')throw Error('Administrador aprovado necessário.');}
function controls(ready=true){for(const id of ['backup','bind'])document.getElementById(id).disabled=!ready||busy;}
onAuthStateChanged(auth,async()=>{try{await admin();document.getElementById('account').textContent='Administrador conectado';controls();}catch(e){document.getElementById('account').textContent=e.message;controls(false);}});
async function action(fn){if(busy)return;busy=true;controls();try{await admin();await fn();}catch(e){say('ERRO: '+e.message);}finally{busy=false;controls();}}
document.getElementById('backup').onclick=()=>action(async()=>{const paths=['ocorrencias','config/gestores','config/setores','users'];const saved={exportedAt:new Date().toISOString()};for(const path of paths)saved[path]=(await get(ref(db,path))).val();saved.fotos={};for(const id of Object.keys(saved.ocorrencias||{}))saved.fotos[id]=(await get(ref(db,'fotos/'+id))).val();
 for(const r of Object.values(saved.ocorrencias||{}))if(r.unitId&&r.unitId!=='101')throw Error('Há registros de outra unidade. Revise antes de vincular o histórico.');
 const text=JSON.stringify(saved,null,2),url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='backup-historico-unidade101-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);plan=saved;say('Backup solicitado: '+Object.keys(saved.ocorrencias||{}).length+' ocorrências. Contas serão preservadas sem atribuição de unidade.');});
document.getElementById('bind').onclick=()=>action(async()=>{if(!plan||!document.getElementById('verified').checked)throw Error('Baixe e confira o backup antes de continuar.');let count=0;
 for(const [id,original] of Object.entries(plan.ocorrencias||{})){const result=await transaction('ocorrencias/'+id,current=>{if(!current)return;if(current.unitId&&current.unitId!=='101')throw Error('Outra unidade encontrada: '+id);if(current.local!==original.local)throw Error('Fábrica alterada durante a manutenção: '+id);return {...current,unitId:'101'};});if(!result.committed)throw Error('Registro removido durante a manutenção: '+id);count++;}
 for(const path of ['config/gestores','config/setores']){const original=plan[path];if(!original)continue;const result=await transaction(path,current=>{if(!current)return;for(const [key,item] of Object.entries(original)){const now=current[key];if(!now||now.nome!==item.nome)throw Error('Cadastro alterado durante a manutenção. Faça novo backup.');if(now.unitId&&now.unitId!=='101')throw Error('Cadastro de outra unidade encontrado.');current[key]={...now,unitId:'101'};}return current;});if(!result.committed)throw Error('Cadastro indisponível: '+path);}
 const after=(await get(ref(db,'ocorrencias'))).val()||{};for(const id of Object.keys(plan.ocorrencias||{}))if(after[id]?.unitId!=='101')throw Error('Vínculo não confirmado: '+id);say('VÍNCULO CONFIRMADO: '+count+' ocorrências e cadastros atuais na unidade 101. Fotos e contas preservadas.');});
</script></html>
